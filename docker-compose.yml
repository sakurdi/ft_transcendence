services:
  db:
    build: ./db
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: appdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sh:/docker-entrypoint-initdb.d/init.sh
      - vault_secrets:/vault/secrets
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d appdb"]
      interval: 4s
      timeout: 4s
      retries: 4
    depends_on:
      vault:
        condition: service_healthy


  vault:
    build: ./vault
    container_name: vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "dev-token"
      VAULT_TOKEN: "dev-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://0.0.0.0:8200"
      VAULT_SKIP_VERIFY: true
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "vault", "kv", "get", "-address=http://127.0.0.1:8200", "secret/ft_transcendence"] 
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - vault_secrets:/vault/secrets


  app:
    build: ./app
    container_name: app
    volumes:
      - ./app:/app
      - ./uploads:/app/uploads
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "dev-token"
    networks:
      - app_net
    depends_on:
      db:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app_net
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:5173 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    ports:
      - "1042:80"
      - "1043:443"
    volumes:
      - ./certs:/etc/nginx/certs
      - ./nginx/site:/etc/nginx/html/:ro
      - ./nginx/modsecurity:/etc/nginx/modsecurity
    networks:
      - app_net
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_healthy

networks:
  app_net:
    driver: bridge

volumes:
  postgres_data:
  vault_secrets:
